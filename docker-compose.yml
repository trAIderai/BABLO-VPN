services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    environment:
      - LANG=ru
      - WG_HOST=${WG_HOST}
      # Bcrypt hash - каждый $ экранирован как $$
      - PASSWORD_HASH=${PASSWORD_HASH}
      - WG_PORT=51820
      - WG_DEFAULT_DNS=10.8.0.1
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - PORT=51821
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=2
      - WG_MTU=1280
    volumes:
      - wg-easy-data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "8053:8080"   # AdGuard Home admin panel
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  # AdGuard Home - DNS server with query logging
  adguard-home:
    image: adguard/adguardhome
    container_name: adguard-home
    network_mode: "service:wg-easy"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - ./adguard:/opt/adguardhome/conf
    restart: unless-stopped
    depends_on:
      - wg-easy

  vpn-ui:
    build: ./frontend
    container_name: vpn-ui
    environment:
      - NODE_ENV=production
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      # VLESS Reality settings (extracted from 3x-ui after setup)
      - WG_HOST=${WG_HOST}
      - VLESS_PORT=${VLESS_PORT:-8443}
      - VLESS_UUID=${VLESS_UUID}
      - REALITY_PUBLIC_KEY=${REALITY_PUBLIC_KEY}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID}
      # Trojan settings
      - TROJAN_PORT=${TROJAN_PORT:-8444}
      - TROJAN_PASSWORD=${TROJAN_PASSWORD}
      # Hysteria2 settings
      - HYSTERIA2_PORT=${HYSTERIA2_PORT:-8445}
      - HYSTERIA2_PASSWORD=${HYSTERIA2_PASSWORD}
      # AdGuard Home
      - ADGUARD_USER=${ADGUARD_USER:-admin}
      - ADGUARD_PASS=${ADGUARD_PASS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - wg-easy
      - xray-ui
      - adguard-home

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    environment:
      - WG_HOST=${WG_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - wg-easy
      - vpn-ui

  # 3x-ui Panel (VLESS/Trojan/Hysteria)
  xray-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: xray-ui
    hostname: xray-ui
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
    volumes:
      - xray-ui-data:/etc/x-ui
      - xray-ui-certs:/root/cert
    ports:
      - "2053:2053"     # Admin panel
      - "8443:8443"     # VLESS Reality
      - "8444:8444"     # Trojan Reality
    restart: unless-stopped
    tty: true

  # Hysteria2 - UDP-based protocol (bypasses TCP-focused DPI)
  hysteria2:
    image: tobyxdd/hysteria:v2
    container_name: hysteria2
    ports:
      - "8445:8445/udp"
    volumes:
      - ./hysteria2/config.yaml:/etc/hysteria/config.yaml:ro
      - ./hysteria2/cert.pem:/etc/hysteria/cert.pem:ro
      - ./hysteria2/key.pem:/etc/hysteria/key.pem:ro
    restart: unless-stopped
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

volumes:
  wg-easy-data:
  caddy-data:
  caddy-config:
  xray-ui-data:
  xray-ui-certs:
  adguard-work:
